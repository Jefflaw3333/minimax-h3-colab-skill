name: tests

on:
  push:
    branches: [main, jeff-g4-workflow]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
